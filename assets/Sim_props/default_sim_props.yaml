sim:
  config:
    optimize_storage: true
    # Integration step: dt = (1/sim_fps)/sim_substeps = 1/600, the same
    # value the historic 60/10 gave. These two must always move together --
    # halving sim_fps alone enlarges dt and the sim never settles -- and
    # anything counted in *frames* below has to be rescaled with them.
    sim_fps: 30
    sim_substeps: 20
    static_check_interval: 8
    lazy_vert_fetch: true
    max_sim_steps: 2500
    max_frame_time: 15
    max_meshgen_time: 60
    max_sim_time: 600
    static_threshold: 0.06        # per-frame bound, rescaled for sim_fps 30
    non_static_percent: 1.0
    max_body_collisions: 1000
    max_self_collisions: 5000
    zero_gravity_steps: 75        # counted in frames, rescaled for sim_fps 30
    resolution_scale: 1.0
    ground: true
    material:
      garment_tri_ka: 40000.0
      garment_edge_ke: 600.0
      garment_tri_ke: 40000.0
      spring_ke: 50000.0
      garment_edge_kd: 10.0
      garment_tri_kd: 1.0
      spring_kd: 10.0
      fabric_density: 1.3
      fabric_thickness: 0.5
      fabric_friction: 0.4
    options:
      enable_particle_particle_collisions: true
      enable_triangle_particle_collisions: true
      enable_edge_edge_collisions: true
      enable_body_collision_filters: true
      enable_global_collision_filter: true
      global_damping_factor: 0.05
      global_damping_effective_velocity: 5.0
      global_max_velocity: 25.0
      enable_attachment_constraint: false
      enable_cloth_reference_drag: false
      enable_body_smoothing: false
      smoothing_total_smoothing_factor: 1.0
      smoothing_recover_start_frame: 150
      smoothing_num_steps: 100
      smoothing_frame_gap_between_steps: 1
      body_collision_thickness: 0.5
      body_friction: 0.5
  stats: {}
render:
  config:
    resolution:
    - 800
    - 800
    sides:
    - front
    - back
    front_camera_location:
    - 0
    - 0.97
    - 4.15
    uv_texture:
      seam_width: 0.5
      dpi: 150
      fabric_grain_texture_path: ./assets/img/fabric_texture.png
      fabric_grain_resolution: 5
  stats: {}
